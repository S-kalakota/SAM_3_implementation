[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "co-bot-vlm"
version = "0.1.0"
description = "Skeleton VLM object-existence verification pipeline for Co-Bot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.10",
]

[project.scripts]
co-bot-vlm = "co_bot_vlm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
