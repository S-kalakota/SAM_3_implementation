services:
  mask_service:
    build:
      context: .
      dockerfile: Dockerfile.mask_service
    image: sam3-mask-service:thor-arm64
    container_name: sam3_mask_service
    network_mode: host
    ipc: host
    runtime: nvidia
    privileged: true
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - HOME=/workspace
      - HF_HOME=/workspace/.cache/huggingface
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_DISABLE_TELEMETRY=1
      - SAM3_AGENT_QWEN_MODEL_ID=${SAM3_AGENT_QWEN_MODEL_ID:-Qwen/Qwen2.5-VL-7B-Instruct}
      - SAM3_AGENT_QWEN_LOCAL_ONLY=1
      - SAM3_AGENT_QWEN_DEVICE_MAP=auto
      - SAM3_AGENT_QWEN_MAX_NEW_TOKENS=512
      - SAM3_AGENT_QWEN_REPETITION_PENALTY=1.15
      - SAM3_INTENT_PARSER_MODE=${SAM3_INTENT_PARSER_MODE:-shadow}
      - SAM3_V2_ENABLED=${SAM3_V2_ENABLED:-0}
      - SAM3_V2_EVALUATION_MODE=${SAM3_V2_EVALUATION_MODE:-0}
      - SAM3_SAM_BACKEND=${SAM3_SAM_BACKEND:-multiplex}
      - SAM3_IMAGE_PARITY_REPORT=${SAM3_IMAGE_PARITY_REPORT:-}
      - SAM3_V2_RELATION_THRESHOLD_REPORT=${SAM3_V2_RELATION_THRESHOLD_REPORT:-}
      - SAM3_V2_RELEASE_REPORT=${SAM3_V2_RELEASE_REPORT:-}
      - SAM3_V2_INTERPRET_MAX_NEW_TOKENS=1024
      - SAM3_V2_VISUAL_MAX_NEW_TOKENS=512
      - SAM3_V2_FULL_CONTEXT=1
      - SAM3_QWEN_VERIFIER_MAX_NEW_TOKENS=256
      - SAM3_QWEN_VERIFIER_MIN_CONFIDENCE=0.70
      - SAM3_QWEN_VERIFIER_MAX_AREA_FRACTION=0.25
      - PYTHONPATH=/workspace/project/scripts:/workspace/.local/lib/python3.12/site-packages
      - LD_LIBRARY_PATH=/usr/local/zed/lib:/host-libs/aarch64-linux-gnu
    volumes:
      - .:/workspace/project:rw
      - ${HOME}/.local:/workspace/.local:ro
      - ${HOME}/.cache:/workspace/.cache:rw
      - /usr/local/zed:/usr/local/zed:ro
      - /usr/lib/aarch64-linux-gnu:/host-libs/aarch64-linux-gnu:ro
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/bus/usb:/dev/bus/usb
    working_dir: /workspace/project
    command: >
      bash -lc '
        exec .venv/bin/python -u scripts/mask_service.py --host 127.0.0.1 --port 8765 --warm-qwen
      '
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - >-
          import json, os, urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5));
          assert data.get('qwen_loaded') and data.get('qwen_model') == os.environ['SAM3_AGENT_QWEN_MODEL_ID']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 5m
